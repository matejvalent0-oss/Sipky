name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - capacitor.config.json
      - debug.keystore
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Web address of the app
        run: |
          URL="https://$(echo "${GITHUB_REPOSITORY%%/*}" | tr A-Z a-z).github.io/${GITHUB_REPOSITORY#*/}/"
          if curl -fsS -o /dev/null "${URL}sw.js"; then
            echo "Site is live, the app will load from $URL"
            URL="$URL" node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.server={url:process.env.URL};
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));
            '
          else
            echo "Site is not live yet, the app will contain its own copy"
          fi
          cat capacitor.config.json

      - name: Add Android project
        run: npx cap add android

      - name: Allow camera
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK as download
        uses: actions/upload-artifact@v4
        with:
          name: sipky-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Šípky build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
